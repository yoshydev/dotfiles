# マウス操作を有効化
set -g mouse on

# vi 風キーバインド（コピー操作の制御のため）
setw -g mode-keys vi

# マウスドラッグ選択時、折り返し由来の改行を除去してクリップボードへコピー
# - copy-pipe-no-clear: コピー後にコピーモードを抜けず Enter 送出を防ぐ
# - tr -d '\n': ペイン幅で折り返された箇所の改行を除去
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane \
  send-keys -X copy-pipe-no-clear "tr -d '\n' | clip.exe"

# 256色対応
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# 画像表示(kitty graphics protocol)のエスケープシーケンスをペインに通過させる
# WezTerm等のkitty graphics対応端末上で md-render.nvim 等の画像プレビューを使うために必要
# ※ tmux 3.3a 以降が必要(apt版3.2aは非対応)。-q で古いtmuxでもエラーを出さず無視させる
set -gq allow-passthrough on

# ウィンドウ番号を1始まりに
set -g base-index 1
setw -g pane-base-index 1

# ウィンドウ閉じた時に番号を詰める
set -g renumber-windows on

# Escキーの遅延を解消（Vim向け）
set -sg escape-time 0

# モダンなキーシーケンス透過（Claude Code等のショートカット対応）
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# フォーカスイベントをアプリへ転送（Claude Code等のフォーカス追跡・通知出し分け対応）
set -g focus-events on

# アクティブペインの視認性向上
set -g window-style 'fg=colour240'
set -g window-active-style 'fg=terminal,bg=terminal'
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour205'
set -g pane-border-lines double

# ステータスバー
set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=colour125,fg=colour255'
set -g status-right '"#{=21:pane_title}" %y-%m-%d %H:%M'
